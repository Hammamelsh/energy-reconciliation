[project]
name = "energy-reconciliation"
version = "0.1.0"
description = "Half-hourly smart-meter readings from the Low Carbon London trial, taken to a tested, versioned tariff calculation in DuckDB and dbt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-core==1.12.4",
    "dbt-duckdb==1.11.0",
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_reconciliation"]

[project.scripts]
profile-member = "energy_reconciliation.profiling.cli:main"
ingest-member = "energy_reconciliation.ingest.cli:main"
build-tariff-scenario = "energy_reconciliation.tariff.cli:main"
capture-baseline = "energy_reconciliation.tariff.baseline_cli:capture_main"
replay-baseline = "energy_reconciliation.tariff.baseline_cli:replay_main"
capture-published-baseline = "energy_reconciliation.tariff.baseline_cli:capture_published_main"
replay-published-baseline = "energy_reconciliation.tariff.baseline_cli:replay_published_main"
compare-scenarios = "energy_reconciliation.tariff.compare_cli:main"
run-forecast-experiment = "energy_reconciliation.forecast.cli:main"
run-prior-eligibility = "energy_reconciliation.forecast.prior_cli:main"
zero-day-runs = "energy_reconciliation.quality.zero_days:main"
compare-flat-price = "energy_reconciliation.tariff.flat_comparison:main"
serving-snapshot = "energy_reconciliation.serving:main"
export-presentation = "energy_reconciliation.presentation:main"
render-dbt-macros = "energy_reconciliation.dbt_macros:main"
run-dbt = "energy_reconciliation.dbt_run:main"
build-candidate = "energy_reconciliation.candidate:main"
publication = "energy_reconciliation.publication:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
