[project]
name = "energy-reconciliation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_reconciliation"]

[project.scripts]
profile-member = "energy_reconciliation.profiling.cli:main"
ingest-member = "energy_reconciliation.ingest.cli:main"
build-tariff-scenario = "energy_reconciliation.tariff.cli:main"
capture-baseline = "energy_reconciliation.tariff.baseline_cli:capture_main"
replay-baseline = "energy_reconciliation.tariff.baseline_cli:replay_main"
compare-scenarios = "energy_reconciliation.tariff.compare_cli:main"
run-forecast-experiment = "energy_reconciliation.forecast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
